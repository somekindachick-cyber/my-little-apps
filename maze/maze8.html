<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>双头迷宫 - 纯净本地版</title>
    <style>
        :root {
            --pixel-pink: #ff79c6;
            --pixel-purple: #bd93f9;
            --pixel-yellow: #f1fa8c;
            --pixel-green: #50fa7b;
            --pixel-red: #ff5555;
            --pixel-blue: #8be9fd;
            --bg-dark: #282a36;
        }

        /* 移除了外部谷歌字体，改用经典的等宽和粗体系统像素风样式 */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Impact', 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #ui-panel {
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
        }

        h1 {
            margin: 5px 0 2px 0;
            font-size: 28px;
            color: var(--pixel-yellow);
            text-shadow: 3px 3px 0px #000;
            letter-spacing: 2px;
        }

        .instructions {
            font-size: 13px;
            color: #bd93f9;
            margin: 0 0 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #stats {
            display: flex;
            justify-content: space-around;
            width: 90vw;
            max-width: 500px;
            font-size: 14px;
            font-weight: bold;
            background: #44475a;
            padding: 8px 0;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            letter-spacing: 1px;
        }

        .stat-box span {
            color: var(--pixel-green);
        }

        #canvas-container {
            position: relative;
            margin-top: 5px;
            border: 6px solid #000;
            background: #111;
            touch-action: none; 
            /* 防止任何抗锯齿，强制绝对像素化 */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        canvas {
            display: block;
            background-color: #111;
            max-width: 92vw;
            max-height: 60vh;
        }

        #victory-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            color: var(--pixel-yellow);
            text-shadow: 3px 3px 0px #000;
            display: none;
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px 30px;
            border: 4px solid var(--pixel-green);
            pointer-events: none;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1>双头迷宫</h1>
        <p class="instructions">拖拽移动小球到达终点</p>
        <div id="stats">
            <div class="stat-box">TIME: <span id="timer">00:00</span></div>
            <div class="stat-box">LEVEL: <span id="win-count">1</span></div>
            <div class="stat-box">SIZE: <span id="maze-size">11x11</span></div>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="550" height="550"></canvas>
        <div id="victory-msg">恭喜通关！</div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const winCountEl = document.getElementById('win-count');
const timerEl = document.getElementById('timer');
const sizeEl = document.getElementById('maze-size');
const victoryMsg = document.getElementById('victory-msg');

// 关闭浏览器自带的高清平滑，锁定纯硬件像素渲染
ctx.imageSmoothingEnabled = false;
ctx.mozImageSmoothingEnabled = false;
ctx.webkitImageSmoothingEnabled = false;
ctx.msImageSmoothingEnabled = false;

let currentLevel = 1;
let COLS = 11; 
let ROWS = 11;
let CELL_SIZE = canvas.width / COLS;

let maze = [];
let wallColors = []; 
let particles = []; 
let startTime;
let timerInterval;

const wallPallete = ['#ff79c6', '#bd93f9', '#f1fa8c', '#50fa7b'];

const p1 = {
    id: 1, color: '#ff5555', // 纯正红
    x: 0, y: 0, targetX: 0, targetY: 0,
    path: [], reached: false
};

const p2 = {
    id: 2, color: '#8be9fd', // 纯正蓝
    x: 0, y: 0, targetX: 0, targetY: 0,
    path: [], reached: false
};

let activePlayer = null; 
let isDragging = false;
let decorations = [];

function updateDifficulty() {
    let size = 11 + Math.floor((currentLevel - 1) / 2) * 2;
    size = Math.min(size, 23); // 降低移动端最大上限，防止太密按不到
    COLS = size;
    ROWS = size;
    CELL_SIZE = canvas.width / COLS;
    sizeEl.innerText = `${COLS}x${COLS}`;
}

function initDecorations() {
    decorations = [];
    for(let i=0; i<25; i++) {
        decorations.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 3 + 3,
            type: Math.floor(Math.random() * 2)
        });
    }
}

function initMaze() {
    maze = Array(ROWS).fill().map(() => Array(COLS).fill(1));
    wallColors = Array(ROWS).fill().map(() => Array(COLS).fill(''));
    
    let stack = [];
    let startX = 1, startY = 1;
    maze[startY][startX] = 0;
    stack.push({x: startX, y: startY});

    while(stack.length > 0) {
        let current = stack[stack.length - 1];
        let neighbors = [];
        let dirs = [{x:0, y:-2}, {x:0, y:2}, {x:-2, y:0}, {x:2, y:0}];
        for(let d of dirs) {
            let nx = current.x + d.x;
            let ny = current.y + d.y;
            if(nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && maze[ny][nx] === 1) {
                neighbors.push({x: nx, y: ny, wallX: current.x + d.x/2, wallY: current.y + d.y/2});
            }
        }
        if(neighbors.length > 0) {
            let next = neighbors[Math.floor(Math.random() * neighbors.length)];
            maze[next.wallY][next.wallX] = 0;
            maze[next.y][next.x] = 0;
            stack.push({x: next.x, y: next.y});
        } else {
            stack.pop();
        }
    }
    
    const ensure = [
        [0, 0], [0, 1], [1, 0],
        [ROWS-1, COLS-1], [ROWS-2, COLS-1], [ROWS-1, COLS-2],
        [ROWS-1, 0], [ROWS-2, 0], [ROWS-1, 1],
        [0, COLS-1], [0, COLS-2], [1, COLS-1]
    ];
    ensure.forEach(([r,c]) => {
        if(r >= 0 && r < ROWS && c >= 0 && c < COLS) maze[r][c] = 0;
    });

    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            if(maze[r][c] === 1) {
                wallColors[r][c] = wallPallete[Math.floor(Math.random() * wallPallete.length)];
            }
        }
    }
}

function startNewLevel() {
    updateDifficulty();
    initMaze();
    initDecorations();

    p1.x = 0; p1.y = 0;
    p1.targetX = COLS - 1; p1.targetY = ROWS - 1;
    p1.path = [{x: 0, y: 0}]; p1.reached = false;

    p2.x = 0; p2.y = ROWS - 1;
    p2.targetX = COLS - 1; p2.targetY = 0;
    p2.path = [{x: 0, y: ROWS - 1}]; p2.reached = false;

    activePlayer = null;
    isDragging = false;
    victoryMsg.style.display = 'none';
    
    startTime = Date.now();
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const s = (elapsed % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;
}

function drawPixelRect(x, y, w, h, color) {
    let depth = Math.max(2, Math.floor(w * 0.12)); 
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x, y, w, depth);
    ctx.fillRect(x, y, depth, h);
    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x, y + h - depth, w, depth);
    ctx.fillRect(x + w - depth, y, depth, h);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 点缀
    ctx.fillStyle = "#3a3d52";
    decorations.forEach(d => {
        if(d.type === 0) ctx.fillRect(d.x, d.y, d.size, d.size);
        else {
            ctx.fillRect(d.x, d.y - d.size, d.size, d.size * 3);
            ctx.fillRect(d.x - d.size, d.y, d.size * 3, d.size);
        }
    });

    // 墙
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (maze[r][c] === 1) {
                drawPixelRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE, wallColors[r][c]);
            }
        }
    }

    // 终点
    function drawEnd(p) {
        const x = p.targetX * CELL_SIZE;
        const y = p.targetY * CELL_SIZE;
        let padding = CELL_SIZE * 0.15;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(3, CELL_SIZE * 0.1);
        ctx.strokeRect(x + padding, y + padding, CELL_SIZE - padding*2, CELL_SIZE - padding*2);
        ctx.fillStyle = p.color;
        ctx.fillRect(x + CELL_SIZE/2 - padding, y + CELL_SIZE/2 - padding, padding*2, padding*2);
    }
    drawEnd(p1);
    drawEnd(p2);

    // 轨迹
    function drawPixelTrail(p) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.3;
        p.path.forEach(pos => {
            ctx.fillRect(pos.x * CELL_SIZE + CELL_SIZE*0.25, pos.y * CELL_SIZE + CELL_SIZE*0.25, CELL_SIZE*0.5, CELL_SIZE*0.5);
        });
        ctx.globalAlpha = 1.0;
    }
    drawPixelTrail(p1);
    drawPixelTrail(p2);

    // 角色
    function drawPixelPlayer(p) {
        let offset = CELL_SIZE * 0.12;
        const x = p.x * CELL_SIZE + offset;
        const y = p.y * CELL_SIZE + offset;
        const size = CELL_SIZE - offset * 2;
        drawPixelRect(x, y, size, size, p.color);
        
        let eyeSize = Math.max(2, size * 0.18);
        ctx.fillStyle = "#000";
        ctx.fillRect(x + size*0.18, y + size*0.25, eyeSize, eyeSize);
        ctx.fillRect(x + size*0.58, y + size*0.25, eyeSize, eyeSize);
    }
    drawPixelPlayer(p1);
    drawPixelPlayer(p2);

    drawPixelFireworks();
}

function createPixelFirework() {
    const x = Math.random() * canvas.width;
    const y = Math.random() * (canvas.height / 2) + 50;
    const color = wallPallete[Math.floor(Math.random() * wallPallete.length)];
    for (let i = 0; i < 30; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() * 12 - 6),
            vy: (Math.random() * 12 - 6),
            life: 1.0, color: color,
            size: 6
        });
    }
}

function drawPixelFireworks() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life -= 0.025;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        // 强制烟花粒子也对齐在 6像素的网格上，强化像素感
        ctx.fillRect(Math.round(p.x/6)*6, Math.round(p.y/6)*6, p.size, p.size);
        ctx.globalAlpha = 1.0;
    }
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let cx = e.clientX || (e.touches && e.touches[0].clientX);
    let cy = e.clientY || (e.touches && e.touches[0].clientY);
    const x = (cx - rect.left) / (rect.right - rect.left) * canvas.width;
    const y = (cy - rect.top) / (rect.bottom - rect.top) * canvas.height;
    return { col: Math.floor(x / CELL_SIZE), row: Math.floor(y / CELL_SIZE) };
}

function handleStart(e) {
    if (p1.reached && p2.reached) return;
    const pos = getPos(e);
    // 增加动态容错：当格子变小，磁吸判定半径相对扩大
    const clickRadius = COLS > 15 ? 1.6 : 1.3;
    const d1 = Math.hypot(pos.col - p1.x, pos.row - p1.y);
    const d2 = Math.hypot(pos.col - p2.x, pos.row - p2.y);
    
    if (d1 < clickRadius && !p1.reached) { activePlayer = p1; isDragging = true; }
    else if (d2 < clickRadius && !p2.reached) { activePlayer = p2; isDragging = true; }
}

function handleMove(e) {
    if (!isDragging || !activePlayer) return;
    const pos = getPos(e);
    if (pos.col < 0 || pos.col >= COLS || pos.row < 0 || pos.row
