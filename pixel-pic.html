<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素画生成器（调试增强版）</title>
    <style>
        :root { --primary-color: #4a90e2; --bg-color: #f5f7fa; }
        body { font-family: sans-serif; background-color: var(--bg-color); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        .controls { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .btn { background: var(--primary-color); color: white; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        canvas { max-width: 100%; height: auto; background: #eee; display: block; margin: 20px auto; image-rendering: pixelated; }
        .error-log { color: #e74c3c; background: #fde8e8; padding: 10px; border-radius: 6px; display: none; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <h1>👾 像素画生成器</h1>

    <div class="container">
        <div class="controls">
            <div>
                <label style="font-weight:bold;">1. 上传图片：</label>
                <input type="file" id="upload" accept="image/*">
            </div>
            <div>
                <label style="font-weight:bold;">2. 像素大小: <span id="size-val">12</span>px</label>
                <input type="range" id="pixel-size" min="2" max="50" value="12" style="width:100%;">
            </div>
        </div>

        <div id="error-box" class="error-log"></div>
        <canvas id="canvas"></canvas>
        <div style="text-align: center;">
            <button id="download" class="btn" style="background:#2ecc71; display:none;">下载像素画</button>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const pixelSizeSlider = document.getElementById('pixel-size');
        const sizeVal = document.getElementById('size-val');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('download');
        const errorBox = document.getElementById('error-box');

        let originalImage = null;

        function showImgError(msg) {
            errorBox.textContent = "【错误提示】" + msg;
            errorBox.style.display = 'block';
        }

        upload.addEventListener('change', function(e) {
            errorBox.style.display = 'none';
            const file = e.target.files[0];
            if (!file) return;

            // 检查文件类型
            if (!file.type.startsWith('image/')) {
                showImgError('请确保上传的是图片文件（png/jpg/jpeg/gif等）');
                return;
            }

            const reader = new FileReader();
            
            reader.onerror = function() {
                showImgError('文件读取失败，请尝试更换一张图片或更换浏览器。');
            };

            reader.onload = function(event) {
                originalImage = new Image();
                
                originalImage.onerror = function() {
                    showImgError('图片解码失败。如果使用的是高效率图片格式（如苹果的HEIC），请先转换为JPG。');
                };

                originalImage.onload = function() {
                    downloadBtn.style.display = 'inline-block';
                    generatePixelArt();
                };
                
                originalImage.src = event.target.result;
            };
            
            reader.readAsDataURL(file);
        });

        pixelSizeSlider.addEventListener('input', function() {
            sizeVal.textContent = this.value;
            if (originalImage) generatePixelArt();
        });

        function generatePixelArt() {
            if (!originalImage) return;

            try {
                const pixelSize = parseInt(pixelSizeSlider.value);
                const maxDimension = 600;
                let width = originalImage.width;
                let height = originalImage.height;

                if (width > maxDimension || height > maxDimension) {
                    if (width > height) {
                        height = Math.round((height * maxDimension) / width);
                        width = maxDimension;
                    } else {
                        width = Math.round((width * maxDimension) / height);
                        height = maxDimension;
                    }
                }

                canvas.width = width;
                canvas.height = height;

                const scaledWidth = Math.max(1, Math.floor(width / pixelSize));
                const scaledHeight = Math.max(1, Math.floor(height / pixelSize));

                const offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = scaledWidth;
                offscreenCanvas.height = scaledHeight;
                const offscreenCtx = offscreenCanvas.getContext('2d');

                offscreenCtx.imageSmoothingEnabled = true;
                offscreenCtx.drawImage(originalImage, 0, 0, scaledWidth, scaledHeight);

                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(offscreenCanvas, 0, 0, scaledWidth, scaledHeight, 0, 0, width, height);
            } catch (err) {
                showImgError('生成像素画时发生内部错误：' + err.message);
            }
        }

        downloadBtn.addEventListener('click', function() {
            if (!originalImage) return;
            const image = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = 'pixel-art.png';
            link.href = image;
            link.click();
        });
    </script>
</body>
</html>
